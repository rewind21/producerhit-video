# ============================================================
# ProducerHit - GitHub Actions FFmpeg
# Fichier : .github/workflows/ffmpeg.yml
# Repo    : github.com/TON_USER/producerhit-video
# ============================================================
name: ProducerHit FFmpeg Render

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "URL vidéo Pollinations Seedance"
        required: true
      audio_url:
        description: "URL MP3 Google Drive"
        required: true
      image_url:
        description: "URL image Pollinations (fallback)"
        required: true
      seed:
        description: "Seed aléatoire"
        required: true
        default: "12345"
      cta:
        description: "Texte CTA overlay"
        required: false
        default: "Trouve ton beat sur ProducerHit.com"
      run_id:
        description: "Identifiant unique du run (ex: ph_2026-05-31_42)"
        required: false
        default: "ph_run"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Install FFmpeg ──────────────────────────────────
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1

      # ── 2. Télécharge la vidéo Pollinations ───────────────
      - name: Download Pollinations Video
        run: |
          echo "Téléchargement vidéo: ${{ inputs.video_url }}"
          curl -L --max-time 180 --retry 3 --retry-delay 10 \
            -o source_video.mp4 \
            "${{ inputs.video_url }}" || echo "VIDEO_FAILED=true" >> $GITHUB_ENV
          
          if [ -f source_video.mp4 ] && [ $(stat -c%s source_video.mp4) -gt 50000 ]; then
            echo "VIDEO_OK=true" >> $GITHUB_ENV
            echo "Vidéo OK: $(stat -c%s source_video.mp4) bytes"
          else
            echo "VIDEO_OK=false" >> $GITHUB_ENV
            echo "Vidéo trop petite ou absente, fallback sur image"
            # Fallback: télécharge l'image
            curl -L --max-time 60 --retry 2 \
              -o source_image.jpg \
              "${{ inputs.image_url }}"
          fi

      # ── 3. Télécharge la musique ───────────────────────────
      - name: Download Music
        run: |
          echo "Téléchargement musique..."
          curl -L --max-time 120 --retry 3 --retry-delay 5 \
            -o music.mp3 \
            "${{ inputs.audio_url }}"
          echo "Musique: $(stat -c%s music.mp3) bytes"
          if [ $(stat -c%s music.mp3) -lt 10000 ]; then
            echo "❌ Musique trop petite, vérifier URL Google Drive"
            exit 1
          fi

      # ── 4. Render FFmpeg ───────────────────────────────────
      - name: Render Video with FFmpeg
        run: |
          FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          FONT_N="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          CTA="${{ inputs.cta }}"
          TARGET=30

          if [ "$VIDEO_OK" = "true" ]; then
            echo "Mode: Vidéo IA Seedance"
            
            # Durée de la vidéo source
            DUR=$(ffprobe -v quiet -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 source_video.mp4 2>/dev/null || echo "5")
            LOOPS=$(python3 -c "import math; print(max(1, math.ceil($TARGET / float('$DUR'))))")
            echo "Durée source: ${DUR}s → ${LOOPS} boucles"

            ffmpeg -y \
              -stream_loop $LOOPS -i source_video.mp4 \
              -stream_loop -1   -i music.mp3 \
              -filter_complex "
                [0:v]scale=1080:1920:force_original_aspect_ratio=decrease,
                pad=1080:1920:(ow-iw)/2:(oh-ih)/2,
                setsar=1,
                drawtext=fontfile='$FONT':
                  text='ProducerHit.com':
                  fontsize=56:fontcolor=white:
                  x=(w-text_w)/2:y=h*0.86:
                  shadowcolor=black:shadowx=3:shadowy=3:
                  box=1:boxcolor=black@0.50:boxborderw=14,
                drawtext=fontfile='$FONT_N':
                  text='$CTA':
                  fontsize=34:fontcolor=0xFFD700:
                  x=(w-text_w)/2:y=h*0.79:
                  shadowcolor=black:shadowx=2:shadowy=2[vout];
                [1:a]volume=0.78,
                  afade=t=in:st=0:d=1.5,
                  afade=t=out:st=27:d=3[aout]
              " \
              -map "[vout]" -map "[aout]" \
              -t $TARGET \
              -c:v libx264 -preset fast -crf 22 -profile:v high \
              -c:a aac -b:a 192k \
              -pix_fmt yuv420p -movflags +faststart \
              output.mp4

          else
            echo "Mode: Fallback image fixe + Ken Burns"

            ffmpeg -y \
              -loop 1           -i source_image.jpg \
              -stream_loop -1   -i music.mp3 \
              -filter_complex "
                [0:v]scale=1080:1920,
                zoompan=z='min(zoom+0.0003,1.12)':
                  d=900:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1080x1920,
                noise=alls=5:allf=t+u,
                hue=h='4*sin(t)':s=1.04,
                vignette=PI/5,
                drawtext=fontfile='$FONT':
                  text='ProducerHit.com':
                  fontsize=56:fontcolor=white:
                  x=(w-text_w)/2:y=h*0.86:
                  shadowcolor=black:shadowx=3:shadowy=3:
                  box=1:boxcolor=black@0.50:boxborderw=14,
                drawtext=fontfile='$FONT_N':
                  text='$CTA':
                  fontsize=34:fontcolor=0xFFD700:
                  x=(w-text_w)/2:y=h*0.79:
                  shadowcolor=black:shadowx=2:shadowy=2[vout];
                [1:a]volume=0.78,
                  afade=t=in:st=0:d=1.5,
                  afade=t=out:st=27:d=3[aout]
              " \
              -map "[vout]" -map "[aout]" \
              -t $TARGET -r 30 \
              -c:v libx264 -preset fast -crf 22 -profile:v high \
              -c:a aac -b:a 192k \
              -pix_fmt yuv420p -movflags +faststart \
              output.mp4
          fi

          echo "✅ Vidéo finale: $(stat -c%s output.mp4) bytes"
          ls -lh output.mp4

      # ── 5. Upload comme Artifact GitHub ───────────────────
      - name: Upload MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: producerhit_output
          path: output.mp4
          retention-days: 1
          if-no-files-found: error
