# ============================================================
# ProducerHit - GitHub Actions FFmpeg v4
# Vidéo IA en boucle (6-8s répétée sur durée audio)
# ============================================================
name: ProducerHit FFmpeg Render

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: "URL MP3 Google Drive"
        required: true
      image_url:
        description: "URL image Pollinations flux (base pour vidéo)"
        required: true
      seed:
        description: "Seed"
        required: true
        default: "12345"
      cta:
        description: "Texte overlay"
        required: false
        default: "Trouve ton beat sur ProducerHit.com"
      run_id:
        description: "ID unique"
        required: false
        default: "ph_run"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Install ─────────────────────────────────────────
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1

      # ── 2. Génère la vidéo IA via Pollinations (wan ~30s) ──
      - name: Generate AI Video (Pollinations wan)
        run: |
          PROMPT="Smooth hypnotic fluid motion iridescent liquid bubble slowly pulsing morphing mesmerizing color flow blues purples greens cinematic slow motion abstract art loop seamless no text no watermark"
          IMAGE_URL="${{ inputs.image_url }}"
          SEED="${{ inputs.seed }}"

          # Essaie wan en premier (rapide), fallback seedance
          for MODEL in wan seedance nova-reel; do
            echo "Essai modèle: $MODEL"
            URL="https://gen.pollinations.ai/image/$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$PROMPT")?model=${MODEL}&width=1080&height=1920&aspectRatio=9:16&duration=6&seed=${SEED}&image=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$IMAGE_URL")&nologo=true"

            HTTP=$(curl -L --max-time 180 --retry 2 \
              -w "%{http_code}" -o ai_video.mp4 \
              "$URL" 2>/dev/null || echo "000")

            echo "HTTP $MODEL: $HTTP"
            SIZE=$(stat -c%s ai_video.mp4 2>/dev/null || echo 0)
            echo "Taille: $SIZE bytes"

            # Valide que c'est un vrai flux vidéo
            if ffprobe -v quiet -select_streams v:0 \
               -show_entries stream=codec_type \
               -of default=noprint_wrappers=1:nokey=1 \
               ai_video.mp4 2>/dev/null | grep -q video; then
              echo "VIDEO_MODEL=$MODEL" >> $GITHUB_ENV
              echo "VIDEO_OK=true" >> $GITHUB_ENV
              echo "✅ Vidéo IA valide avec $MODEL"
              break
            else
              echo "⚠️ $MODEL invalide, essai suivant..."
              rm -f ai_video.mp4
              echo "VIDEO_OK=false" >> $GITHUB_ENV
            fi
          done

      # ── 3. Fallback image si aucun modèle vidéo n'a marché ─
      - name: Download Fallback Image
        if: env.VIDEO_OK != 'true'
        run: |
          echo "Fallback: téléchargement image Pollinations..."
          curl -L --max-time 60 --retry 3 \
            -o source_image.jpg \
            "${{ inputs.image_url }}"
          SIZE=$(stat -c%s source_image.jpg 2>/dev/null || echo 0)
          if [ "$SIZE" -lt 5000 ]; then
            echo "❌ Image trop petite ($SIZE bytes)"
            exit 1
          fi
          echo "✅ Image fallback: $SIZE bytes"

      # ── 4. Télécharge la musique ───────────────────────────
      - name: Download Music
        run: |
          echo "Téléchargement musique..."
          curl -L --max-time 120 --retry 3 --retry-delay 5 \
            -o music.mp3 \
            "${{ inputs.audio_url }}"
          SIZE=$(stat -c%s music.mp3 2>/dev/null || echo 0)
          echo "Musique: $SIZE bytes"
          if [ "$SIZE" -lt 10000 ]; then
            echo "❌ Musique non téléchargée ($SIZE bytes)"
            echo "Astuce: héberge tes MP3 sur GitHub Releases pour éviter les blocages Drive"
            exit 1
          fi
          # Récupère la durée audio pour la durée finale
          AUDIO_DUR=$(ffprobe -v quiet -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 music.mp3 2>/dev/null || echo "30")
          # Sécurise la valeur
          if ! [[ "$AUDIO_DUR" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            AUDIO_DUR=30
          fi
          AUDIO_DUR_INT=$(echo "$AUDIO_DUR" | cut -d. -f1)
          echo "AUDIO_DUR=$AUDIO_DUR_INT" >> $GITHUB_ENV
          echo "✅ Musique OK - durée: ${AUDIO_DUR_INT}s"

      # ── 5. FFmpeg : boucle vidéo IA sur durée audio ────────
      - name: Render — AI Video Loop
        if: env.VIDEO_OK == 'true'
        run: |
          FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          FONT_N="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          CTA=$(echo "${{ inputs.cta }}" | sed "s/[':\/]/ /g" | cut -c1-50)
          TARGET=${{ env.AUDIO_DUR }}

          # Durée de la vidéo IA (ex: 6s)
          DUR_RAW=$(ffprobe -v quiet -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 ai_video.mp4 2>/dev/null || echo "6")
          if ! [[ "$DUR_RAW" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then DUR_RAW=6; fi
          DUR_INT=$(echo "$DUR_RAW" | cut -d. -f1)
          if [ "$DUR_INT" -lt 1 ]; then DUR_INT=6; fi

          # Calcul du nombre de boucles nécessaires
          LOOPS=$(( ($TARGET + $DUR_INT - 1) / $DUR_INT ))
          echo "Vidéo IA: ${DUR_INT}s × ${LOOPS} boucles = ~$((DUR_INT * LOOPS))s (audio: ${TARGET}s)"
          echo "Modèle utilisé: ${{ env.VIDEO_MODEL }}"

          ffmpeg -y \
            -stream_loop $LOOPS -i ai_video.mp4 \
            -i music.mp3 \
            -filter_complex "\
              [0:v]scale=1080:1920:force_original_aspect_ratio=decrease,\
              pad=1080:1920:(ow-iw)/2:(oh-ih)/2,setsar=1,\
              drawtext=fontfile='$FONT':\
                text='ProducerHit.com':\
                fontsize=56:fontcolor=white:\
                x=(w-text_w)/2:y=h*0.87:\
                shadowcolor=black:shadowx=3:shadowy=3:\
                box=1:boxcolor=black@0.5:boxborderw=14,\
              drawtext=fontfile='$FONT_N':\
                text='$CTA':\
                fontsize=34:fontcolor=0xFFD700:\
                x=(w-text_w)/2:y=h*0.80:\
                shadowcolor=black:shadowx=2:shadowy=2[vout];\
              [1:a]volume=0.78,\
                afade=t=in:st=0:d=1.5,\
                afade=t=out:st=$(($TARGET - 3)):d=3[aout]" \
            -map "[vout]" -map "[aout]" \
            -t $TARGET \
            -c:v libx264 -preset fast -crf 22 -profile:v high \
            -c:a aac -b:a 192k \
            -pix_fmt yuv420p -movflags +faststart \
            output.mp4

          echo "✅ Vidéo finale (boucle IA): $(stat -c%s output.mp4) bytes"
          ls -lh output.mp4

      # ── 6. FFmpeg fallback : image Ken Burns ───────────────
      - name: Render — Fallback Image Ken Burns
        if: env.VIDEO_OK != 'true'
        run: |
          FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          FONT_N="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          CTA=$(echo "${{ inputs.cta }}" | sed "s/[':\/]/ /g" | cut -c1-50)
          TARGET=${{ env.AUDIO_DUR }}

          ffmpeg -y \
            -loop 1 -i source_image.jpg \
            -i music.mp3 \
            -filter_complex "\
              [0:v]scale=1080:1920,\
              zoompan=z='min(zoom+0.0003,1.12)':\
                d=900:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1080x1920,\
              noise=alls=5:allf=t+u,hue=h='4*sin(t)':s=1.04,vignette=PI/5,\
              drawtext=fontfile='$FONT':\
                text='ProducerHit.com':\
                fontsize=56:fontcolor=white:\
                x=(w-text_w)/2:y=h*0.87:\
                shadowcolor=black:shadowx=3:shadowy=3:\
                box=1:boxcolor=black@0.5:boxborderw=14,\
              drawtext=fontfile='$FONT_N':\
                text='$CTA':\
                fontsize=34:fontcolor=0xFFD700:\
                x=(w-text_w)/2:y=h*0.80:\
                shadowcolor=black:shadowx=2:shadowy=2[vout];\
              [1:a]volume=0.78,\
                afade=t=in:st=0:d=1.5,\
                afade=t=out:st=$(($TARGET - 3)):d=3[aout]" \
            -map "[vout]" -map "[aout]" \
            -t $TARGET -r 30 \
            -c:v libx264 -preset fast -crf 22 -profile:v high \
            -c:a aac -b:a 192k \
            -pix_fmt yuv420p -movflags +faststart \
            output.mp4

          echo "✅ Vidéo finale (fallback): $(stat -c%s output.mp4) bytes"
          ls -lh output.mp4

      # ── 7. Upload Artifact ─────────────────────────────────
      - name: Upload MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: producerhit_output
          path: output.mp4
          retention-days: 1
          if-no-files-found: error
